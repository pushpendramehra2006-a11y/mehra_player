name: Build and Release Direct APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Light Aesthetic Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Clean Light Aesthetic Icon generation (Soft Pastel Slate + Dark Slate Play Triangle)
          convert -size 512x512 xc:"#F1F5F9" \
            -fill "#CBD5E1" -draw "rectangle 0,0 511,511" \
            -fill "#F8FAFC" -draw "rectangle 12,12 499,499" \
            -fill "#1E293B" -draw "polygon 200,150 360,256 200,362" \
            base_icon.png

          # Generate exact standard Android mipmap resolutions
          mkdir -p android/app/src/main/res/mipmap-mdpi && convert base_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-hdpi && convert base_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi && convert base_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi && convert base_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi && convert base_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          rm base_icon.png
          echo "All Android launcher icons generated successfully!"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Mehra Player Latest Build"
          body: "Mehra Player release with smooth 120 FPS playback, Pixel Vivid HDR, 8D audio, and clean light aesthetic icon."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
