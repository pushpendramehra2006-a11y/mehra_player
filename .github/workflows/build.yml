name: Build and Release Direct APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Light Aesthetic Icon
        run: |
          python3 -c "
          import os, base64
          # Clean, modern, soft light aesthetic play icon (PNG)
          b64 = ''
          icon_bytes = base64.b64decode(b64)
          for res in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              folder = f'android/app/src/main/res/mipmap-{res}'
              os.makedirs(folder, exist_ok=True)
              with open(f'{folder}/ic_launcher.png', 'wb') as f:
                  f.write(icon_bytes)
          print('Light icons successfully generated!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Mehra Player Latest Build"
          body: "Mehra Player latest release with smooth 120 FPS playback, Pixel Vivid HDR, 8D audio, and clean light aesthetic icon."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
